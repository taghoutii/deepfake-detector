version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./model.pt:/app/model.pt
    environment:
      - PYTHONUNBUFFERED=1

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000/predict
      - PYTHONUNBUFFERED=1

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.11.1
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - mlflow-db:/mlflow-db
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow-db/mlflow.db
      --artifacts-destination /mlruns
      --serve-artifacts
      --allowed-hosts localhost:5000,127.0.0.1:5000,mlflow:5000

volumes:
  mlflow-db:
    name: deepfake-detector-mlflow-db